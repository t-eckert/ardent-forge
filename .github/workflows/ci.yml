name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Python — pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install Python
        run: uv python install 3.13
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Configure git identity
        # Several tests create real git commits; without a global identity
        # `git commit` fails with "Please tell me who you are".
        run: |
          git config --global user.email "ci@ardent-forge.local"
          git config --global user.name "Ardent Forge CI"
          git config --global init.defaultBranch main
      - name: Install deps
        run: uv sync --all-extras
      - name: pytest
        run: uv run pytest -q

  frontend:
    name: UI — typecheck, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Install Playwright chromium
        # @vitest/browser (via the Storybook test addon) needs chromium to
        # run component stories. Install only chromium to keep the job fast.
        run: pnpm exec playwright install chromium --with-deps
      - name: Typecheck
        run: pnpm check
      - name: Unit + storybook tests
        run: pnpm test
      - name: Build
        run: pnpm build
